name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # The old `coverage` job ran scripts/coverage-gate.py, which enforced 100%
  # LINE **and** function coverage at `--all-features`, honoring
  # `// cov:unreachable`. The shared workflow's default gate is the line half,
  # verbatim. The function half is not lost in practice: this repo carries zero
  # `cov:unreachable` markers, so "every line covered" already implies "every
  # function entered". MSRV is read from rust-version (1.85), which is what the
  # old `msrv` job pinned by hand.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@a62ab10603151071744cec0b4e3638aa6406d4e4
    with:
      # Carried across: the old gate scoped itself to the crate's own
      # `**/src/**` "excluding tests/ and main.rs" — the Humble-Object CLI shell
      # is exercised by integration tests but deliberately not gated to 100%.
      # forensic/src/main.rs exists, so without this the gate would newly cover
      # it. NOTE: metacharacter-free on purpose — this value is interpolated
      # UNQUOTED into the coverage job's shell, so `(`/`|`/`)` would abort the
      # job with a bash syntax error. llvm-cov matches it as an unanchored
      # substring regex, so the plain path is sufficient.
      coverage-ignore-regex: src/main.rs
