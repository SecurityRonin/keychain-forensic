[package]
name = "keychain-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.keychain-core]
path = ".."

# Prevent this from interfering with workspace members up the tree.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_container"
path = "fuzz_targets/fuzz_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ssgp"
path = "fuzz_targets/fuzz_ssgp.rs"
test = false
doc = false
bench = false
